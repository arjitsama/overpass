# Ops agent (production template): serves the dashboard at /ui/ and runs the
# planner. deploy/install.sh renders ${...} from agents.env.
role: ops
host: ops.${BASE_DOMAIN}
port: ${OPS_PORT}
public_url: https://ops.${BASE_DOMAIN}
cert: {cert_file: /etc/overpass/certs/ops/server.pem, key_file: /etc/overpass/certs/ops/server.key}
identity: {key_file: /etc/overpass/certs/ops/identity.key, chain_file: /etc/overpass/certs/ops/identity.pem}
db_path: /var/lib/overpass/ops.db
card:
  version: 0.1.0
  agent_id: ${OPS_AGENT_ID}
  display_name: Overpass Ops
  description: Mission operations planner and dashboard.
  org_name: Overpass
  signed_file: /etc/overpass/certs/ops/agent-card.json
  skills:
    - {id: plan_passes, name: Plan passes, tags: [scheduler]}
ui:
  webmesh_url: https://agent.webmesh.ai/mcp
  verify_host: gs-blacksburg.${BASE_DOMAIN}
  # No trust index runs in production (authority-tonight.yaml sets trust_index.url
  # to ""), so the dashboard says so instead of showing scores or a tier, and
  # states what actually grants uplink.
  trust_index_note: not deployed
  access_basis: "Uplink: operator allow-list (flight rules)"
  refresh_every: 10m
  battery_live_file: /etc/overpass/battery-live.json
  fraud_redteam_file: /etc/overpass/fraud-redteam.md
  # Verified live on every refresh, in this order. Agents that are registered
  # but not running are listed as "not deployed" and never contacted.
  agents:
    - {host: ops.${BASE_DOMAIN}, role: Mission Ops}
    - {host: authority.${BASE_DOMAIN}, role: Authority}
    - {host: gs-blacksburg.${BASE_DOMAIN}, role: Ground station}
    - {host: gs-sva1bard-eu.${BASE_DOMAIN}, role: Impostor (unregistered)}
    - {host: gs-awarua.${BASE_DOMAIN}, role: Ground station, deployed: false}
    - {host: gs-svalbard-eu.${BASE_DOMAIN}, role: Ground station, deployed: false}
peers:
  - {name: authority, url: https://authority.${BASE_DOMAIN}}
  - {name: gs-blacksburg, url: https://gs-blacksburg.${BASE_DOMAIN}}
  - {name: gs-awarua, url: https://gs-awarua.${BASE_DOMAIN}}
  - {name: gs-svalbard-eu, url: https://gs-svalbard-eu.${BASE_DOMAIN}}
  - {name: gs-rogue, url: https://gs-rogue.${BASE_DOMAIN}}
environments:
  prod: {registry_url: ${REGISTRY_URL}, log_url: ${LOG_URL}, log_public_url: ${LOG_PUBLIC_URL}, root_keys: ["${ANS_ROOT_KEYS}"]}
# AP2 request signing key (Ed25519) for authority.webmesh.ai request_mandate:
# the authority fetches the caller's public JWK from this URL. Not in the card.
well_known_files:
  - {path: /.well-known/jwks.json, file: /etc/overpass/certs/ops/ap2-jwks.json, content_type: application/json}
