# Spare registered station (production template): the designated target for the one optional, terminal, real revoke. deploy/install.sh renders this
# with agents.env: ${BASE_DOMAIN}, ${GS_SPARE_*}, ${REGISTRY_URL} etc.
role: station
host: gs-spare.${BASE_DOMAIN}
port: ${GS_SPARE_PORT}
public_url: https://gs-spare.${BASE_DOMAIN}
cert: {cert_file: /etc/overpass/certs/gs-spare/server.pem, key_file: /etc/overpass/certs/gs-spare/server.key}
identity: {key_file: /etc/overpass/certs/gs-spare/identity.key, chain_file: /etc/overpass/certs/gs-spare/identity.pem}
db_path: /var/lib/overpass/gs-spare.db
pricing: {per_minute_cents: 125, pay_to: "0xSpareWallet", network: base-sepolia, asset: USDC, asset_decimals: 6}
satreg: {file: /etc/overpass/registry.jws, signer_key_file: /etc/overpass/authority.pub}
authority_keys:
  - {ans_name: ans://v0.1.0.authority.${BASE_DOMAIN}, key_file: /etc/overpass/authority.pub}
session: {spacecraft_url: https://spacecraft.${BASE_DOMAIN}, ops_env: prod}
card:
  version: 0.1.0
  agent_id: ${GS_SPARE_AGENT_ID}
  display_name: Ground Station Spare
  description: Spare registered station. The ONE optional real ans-cli revoke targets this host, never gs-blacksburg.
  org_name: Overpass
  signed_file: /etc/overpass/certs/gs-spare/agent-card.json
  skills:
    - {id: get_pass_quote, name: Pass quote, tags: [uplink-uhf, downlink-uhf]}
    - {id: book_pass, name: Book pass, tags: [uplink-uhf, downlink-uhf]}
    - {id: relay_command, name: Relay command}
    - {id: session_evidence, name: Session evidence}
environments:
  prod: {registry_url: ${REGISTRY_URL}, log_url: ${LOG_URL}, log_public_url: ${LOG_PUBLIC_URL}, root_keys: ["${ANS_ROOT_KEYS}"]}
