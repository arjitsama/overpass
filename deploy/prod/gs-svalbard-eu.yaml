# Registered lookalike station (production template). Identity is not trust. deploy/install.sh renders this
# with agents.env: ${BASE_DOMAIN}, ${GS_SVALBARD_*}, ${REGISTRY_URL} etc.
role: station
host: gs-svalbard-eu.${BASE_DOMAIN}
port: ${GS_SVALBARD_PORT}
public_url: https://gs-svalbard-eu.${BASE_DOMAIN}
cert: {cert_file: /etc/overpass/certs/gs-svalbard-eu/server.pem, key_file: /etc/overpass/certs/gs-svalbard-eu/server.key}
identity: {key_file: /etc/overpass/certs/gs-svalbard-eu/identity.key, chain_file: /etc/overpass/certs/gs-svalbard-eu/identity.pem}
db_path: /var/lib/overpass/gs-svalbard-eu.db
pricing: {per_minute_cents: 125, pay_to: "0xSvalbardWallet", network: base-sepolia, asset: USDC, asset_decimals: 6}
satreg: {file: /etc/overpass/registry.jws, signer_key_file: /etc/overpass/authority.pub}
authority_keys:
  - {ans_name: ans://v0.1.0.authority.${BASE_DOMAIN}, key_file: /etc/overpass/authority.pub}
session: {spacecraft_url: https://spacecraft.${BASE_DOMAIN}, ops_env: prod}
card:
  version: 0.1.0
  agent_id: ${GS_SVALBARD_AGENT_ID}
  display_name: Ground Station Svalbard EU
  description: Registered lookalike: passes identity checks, no seeded trust (stays READ_ONLY).
  org_name: Overpass
  signed_file: /etc/overpass/certs/gs-svalbard-eu/agent-card.json
  skills:
    - {id: get_pass_quote, name: Pass quote, tags: [uplink-uhf, downlink-uhf]}
    - {id: book_pass, name: Book pass, tags: [uplink-uhf, downlink-uhf]}
    - {id: relay_command, name: Relay command}
    - {id: session_evidence, name: Session evidence}
environments:
  prod: {registry_url: ${REGISTRY_URL}, log_url: ${LOG_URL}, log_public_url: ${LOG_PUBLIC_URL}, root_keys: ["${ANS_ROOT_KEYS}"]}
