# Honest ground station (production template). deploy/install.sh renders this
# with agents.env: ${BASE_DOMAIN}, ${GS_BLACKSBURG_*}, ${REGISTRY_URL} etc.
role: station
host: gs-blacksburg.${BASE_DOMAIN}
port: ${GS_BLACKSBURG_PORT}
public_url: https://gs-blacksburg.${BASE_DOMAIN}
cert: {cert_file: /etc/overpass/certs/gs-blacksburg/server.pem, key_file: /etc/overpass/certs/gs-blacksburg/server.key}
identity: {key_file: /etc/overpass/certs/gs-blacksburg/identity.key, chain_file: /etc/overpass/certs/gs-blacksburg/identity.pem}
db_path: /var/lib/overpass/gs-blacksburg.db
# payTo is the null address: no on-chain settlement is performed (README
# "Honest limits"); the card's x-payment carries the same note.
pricing: {per_minute_cents: 125, pay_to: "0x0000000000000000000000000000000000000000", network: base-sepolia, asset: USDC, asset_decimals: 6, note: "simulated; no settlement is performed"}
satreg: {file: /etc/overpass/registry.jws, signer_key_file: /etc/overpass/authority.pub}
authority_keys:
  - {ans_name: ans://v0.1.0.authority.${BASE_DOMAIN}, key_file: /etc/overpass/authority.pub}
# The spacecraft is internal (not ANS-registered) and serves a self-signed cert
# generated on the box; pin it here.
session: {spacecraft_url: https://spacecraft.${BASE_DOMAIN}, ops_env: prod, spacecraft_ca: /etc/overpass/certs/spacecraft/server.pem}
card:
  version: 0.1.0
  agent_id: ${GS_BLACKSBURG_AGENT_ID}
  display_name: Ground Station Blacksburg
  description: UHF ground station, Blacksburg VA.
  org_name: Overpass
  signed_file: /etc/overpass/certs/gs-blacksburg/agent-card.json
  skills:
    - {id: get_pass_quote, name: Pass quote, tags: [uplink-uhf, downlink-uhf]}
    - {id: book_pass, name: Book pass, tags: [uplink-uhf, downlink-uhf]}
    - {id: relay_command, name: Relay command}
    - {id: session_evidence, name: Session evidence}
environments:
  prod: {registry_url: ${REGISTRY_URL}, log_url: ${LOG_URL}, log_public_url: ${LOG_PUBLIC_URL}, root_keys: ["${ANS_ROOT_KEYS}"]}
