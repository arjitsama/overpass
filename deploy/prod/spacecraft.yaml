# Spacecraft (production template): the simulated satellite. It is an INTERNAL
# process with NO public ANS identity — it is not registered on ANS. Its security
# is the Ops signature on every command (typ, signature, NORAD id, strictly
# greater counter), not TLS client identity; the station reaches it over TLS and
# pins its self-signed server cert via session.spacecraft_ca. RF and the bus are
# simulated (see README "Honest limits").
role: spacecraft
host: spacecraft.${BASE_DOMAIN}
port: ${SPACECRAFT_PORT}
public_url: https://spacecraft.${BASE_DOMAIN}
# Self-signed server cert (generated on the box; not an ANS-issued cert).
cert: {cert_file: /etc/overpass/certs/spacecraft/server.pem, key_file: /etc/overpass/certs/spacecraft/server.key}
db_path: /var/lib/overpass/spacecraft.db
spacecraft:
  norad_id: 27844
  ops_key_file: /etc/overpass/certs/ops/command.pub
card:
  version: 0.1.0
  display_name: Spacecraft (simulated)
  description: Simulated CubeSat command endpoint (NORAD 27844). Internal; not ANS-registered.
  org_name: Overpass
  signed_file: /etc/overpass/certs/spacecraft/agent-card.json
  skills:
    - {id: uplink, name: Uplink command, tags: [spacecraft]}
